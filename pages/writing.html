<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avery Reyna | Writing</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body class="bg-white min-h-screen font-oracle">
    <!-- Responsive Warning Banner -->
    <div class="responsive-warning" id="responsiveWarning">
        <i class="fas fa-exclamation-triangle"></i>
        <span class="warning-text">This page is optimized for larger screens. For the best experience, please use a device with a wider viewport.</span>
        <button class="close-warning" onclick="closeWarning()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <nav class="w-full max-w-2xl mx-auto flex flex-row items-center justify-start py-4 px-4 mb-2" style="font-family: 'ABC Otto', sans-serif;">
        <ul class="flex flex-row gap-1">
            <li><a href="/index.html" class="nav-link">About</a></li>
            <li><a href="/pages/cv.html" class="nav-link">CV</a></li>
            <li><a href="/pages/projects.html" class="nav-link">Projects</a></li>
            <!-- <li><a href="/pages/writing.html" class="nav-link nav-link-active">Writing</a></li> -->
        </ul>
    </nav>
    <main class="w-full max-w-2xl mx-auto px-4 pb-8" style="margin-top: 0; text-align: left;">
        <h1 class="text-2xl font-bold mb-8 font-otto">Writing</h1>
        <div class="flex flex-col gap-6">
            <div>
                <div class="font-otto font-bold text-xl mb-2">2025</div>
                <div class="flex flex-col gap-2">
                    <div>
                        <div class="flex items-center">
                            <span></span>
                        </div>
                        <div class="text-xs text-gray-500 mb-0" style="margin-bottom:0.1rem;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-8 text-gray-500 font-otto" style="font-size: 0.75rem; margin-left: 0;">
            <span>Last updated: July 2025</span>
        </div>
    </main>

    <script>
        // Responsive warning functionality
        function checkScreenSize() {
            const warning = document.getElementById('responsiveWarning');
            const body = document.body;
            
            // Show warning only on screens between 481px and 1199px
            if (window.innerWidth >= 481 && window.innerWidth < 1200) {
                if (!localStorage.getItem('warningDismissed')) {
                    warning.classList.add('show');
                    body.classList.add('warning-active');
                }
            } else {
                warning.classList.remove('show');
                body.classList.remove('warning-active');
            }
        }

        function closeWarning() {
            const warning = document.getElementById('responsiveWarning');
            const body = document.body;
            
            warning.classList.remove('show');
            body.classList.remove('warning-active');
            
            // Remember that user dismissed the warning
            localStorage.setItem('warningDismissed', 'true');
        }

        // Check screen size on load and resize
        window.addEventListener('load', checkScreenSize);
        window.addEventListener('resize', checkScreenSize);
    </script>
</body>
</html>
