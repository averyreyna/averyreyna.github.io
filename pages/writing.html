    <main class="w-full max-w-2xl mx-auto px-4 pb-8" style="margin-top: 0; text-align: left;">
        <h1 class="text-2xl font-bold mb-4 font-diatype">Writing</h1>
        
        <div id="writing-filter-bar" class="flex flex-row flex-wrap gap-2 mb-6">
            <button class="filter-tag flex items-center" data-filter="Complex Vector Space">
                <span class="filter-text">Complex Vector Space</span>
                <span class="filter-dot" style="color: #20B2AA; font-size: 0.6em; margin-left: 0.5em;">●</span>
            </button>
            <button class="filter-tag flex items-center" data-filter="Field Notes">
                <span class="filter-text">Field Notes</span>
                <span class="filter-dot" style="color: #dc2626; font-size: 0.6em; margin-left: 0.5em;">●</span>
            </button>
            <button id="clear-filter" class="filter-tag" data-filter="clear" style="display: none;">Clear</button>
        </div>

        <script>
            const writingTags = {
                'The Closer I Looked, the More I Saw God': ['Complex Vector Space'],
                'In the Dark, We Sing': ['Field Notes'],
                'Laughing with Gelli Haha': ['Complex Vector Space']
            };
            
            document.addEventListener('DOMContentLoaded', function() {
                const tags = document.querySelectorAll('.filter-tag');
                const writingItems = document.querySelectorAll('.writing-item');
                const clearButton = document.getElementById('clear-filter');
                
                function showAllWriting() {
                    writingItems.forEach(item => {
                        item.style.display = '';
                    });
                    updateYearContainers();
                }
                
                function updateYearContainers() {
                    const yearContainers = document.querySelectorAll('.writing-year-section');
                    yearContainers.forEach(container => {
                        const visibleItems = container.querySelectorAll('.writing-item:not([style*="display: none"])');
                        const yearHeading = container.previousElementSibling;
                        if (visibleItems.length === 0) {
                            container.parentElement.style.display = 'none';
                        } else {
                            container.parentElement.style.display = '';
                        }
                    });
                }
                
                function isMobile() {
                    return window.innerWidth <= 768;
                }
                
                let expandedTag = null;
                
                tags.forEach(tag => {
                    tag.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        const filter = this.dataset.filter;
                        
                        if (filter === 'clear') {
                            showAllWriting();
                            tags.forEach(t => t.classList.remove('active'));
                            clearButton.style.display = 'none';
                            return;
                        }
                        
                        const isActive = this.classList.contains('active');
                        
                        tags.forEach(t => t.classList.remove('active'));
                        
                        if (isActive) {
                            showAllWriting();
                            clearButton.style.display = 'none';
                        } else {
                            this.classList.add('active');
                            clearButton.style.display = 'inline-block';
                            
                            writingItems.forEach(item => {
                                const titleElement = item.querySelector('.writing-title');
                                if (titleElement) {
                                    const title = titleElement.textContent.replace(/●\s*/, '').trim();
                                    const itemTags = writingTags[title] || [];
                                    
                                    if (itemTags.includes(filter)) {
                                        item.style.display = '';
                                    } else {
                                        item.style.display = 'none';
                                    }
                                }
                            });
                            updateYearContainers();
                        }
                    });
                });
                showAllWriting();
            });
        </script>
        
        <div class="flex flex-col gap-6">

                <div class="font-diatype font-bold text-xl mb-2">2025</div>
                <div class="flex flex-col gap-6 writing-year-section">
                    <div class="writing-item">

                            </span>

                    <div class="writing-item">

                                In the Dark, We Sing
